<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SubMais - Aguarde</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root { --neon-red:#ef4444; --neon-white:#ffffff; --neon-lightred:#f87171; }
  body { margin:0; min-height:100vh; color:#e2e8f0; font-family:'Inter',system-ui,sans-serif; background:#050816; overflow-x:hidden; }
  #bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .orb { position:fixed; border-radius:50%; filter:blur(80px); opacity:.35; z-index:0; pointer-events:none; animation:float 12s ease-in-out infinite; }
  .orb1 { width:420px; height:420px; background:#ef4444; top:-120px; left:-120px; }
  .orb2 { width:500px; height:500px; background:#ffffff; bottom:-180px; right:-150px; animation-delay:-4s; }
  @keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,-30px) scale(1.1)} }
  .glass { background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02)); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12); box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); }
  .neon-text { text-shadow:0 0 12px rgba(239,68,68,.6), 0 0 24px rgba(255,255,255,.4); }
  .btn-neon { background:linear-gradient(135deg,#ef4444,#ffffff); color:#050816; font-weight:700; box-shadow:0 0 20px rgba(239,68,68,.45); transition:transform .2s,filter .2s; }
  .btn-neon:hover { transform:translateY(-2px); filter:brightness(1.15); }
  .count-num { font-variant-numeric: tabular-nums; text-shadow:0 0 30px rgba(239,68,68,.8), 0 0 60px rgba(255,255,255,.5); }
  .ring { position:relative; }
  .ring::before { content:''; position:absolute; inset:-6px; border-radius:50%; background:conic-gradient(#ef4444,#ffffff,#f87171,#ef4444); filter:blur(12px); opacity:.6; animation:spin 3s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .fade-in { animation:fadeIn .5s ease both; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="glass rounded-3xl p-8 max-w-md w-full text-center fade-in">
      <div class="w-16 h-16 rounded-2xl btn-neon flex items-center justify-center font-black text-2xl mx-auto mb-4">S</div>
      <h1 class="text-2xl font-black neon-text mb-1">SubMais</h1>
      <p id="titleEl" class="text-gray-300 text-sm mb-6 truncate"></p>

      <div id="loading" class="py-8">
        <div class="animate-spin w-10 h-10 border-4 border-red-400 border-t-transparent rounded-full mx-auto"></div>
        <p class="text-gray-400 mt-3 text-sm">Carregando link...</p>
      </div>

      <div id="stageBox" class="hidden">
        <p id="stageLabel" class="text-sm text-gray-400 mb-3"></p>
        <div class="ring w-28 h-28 mx-auto mb-4 flex items-center justify-center rounded-full bg-slate-900/60">
          <span id="countdown" class="count-num text-5xl font-black">10</span>
        </div>
        <div class="w-full bg-gray-700/60 rounded-full h-3 overflow-hidden border border-white/10">
          <div id="progressBar" class="h-full bg-gradient-to-r from-red-400 via-white to-red-500 transition-all duration-1000 ease-linear" style="width:0%"></div>
        </div>
        <p class="text-xs text-gray-500 mt-4">Aguarde para ser redirecionado ao destino.</p>
      </div>

      <div id="errorBox" class="hidden py-6">
        <p id="errorMsg" class="text-red-400"></p>
        <a href="index.html" class="inline-block mt-4 text-red-300 underline">Voltar</a>
      </div>

      <div id="doneBox" class="hidden py-6">
        <p class="text-green-400 font-semibold">Redirecionando...</p>
      </div>
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "COLE_SUA_API_KEY",
  authDomain: "nooxsub.firebaseapp.com",
  databaseURL: "https://nooxsub-default-rtdb.firebaseio.com",
  projectId: "nooxsub",
  storageBucket: "nooxsub.appspot.com",
  messagingSenderId: "COLE_SEU_SENDER_ID",
  appId: "COLE_SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const STAGES = 3;
const STAGE_SECONDS = 10;

const params = new URLSearchParams(location.search);
const linkId = params.get('id');

const loading = document.getElementById('loading');
const stageBox = document.getElementById('stageBox');
const errorBox = document.getElementById('errorBox');
const doneBox = document.getElementById('doneBox');
const countdownEl = document.getElementById('countdown');
const progressBar = document.getElementById('progressBar');
const stageLabel = document.getElementById('stageLabel');
const titleEl = document.getElementById('titleEl');

if (!linkId) showError('Link inválido.');
else loadLink(linkId);

async function loadLink(id) {
  try {
    const snap = await db.ref('links/' + id).get();
    if (!snap.exists()) { showError('Link não encontrado.'); return; }
    const data = snap.val();
    titleEl.textContent = data.title || data.url;
    loading.classList.add('hidden');
    stageBox.classList.remove('hidden');
    runStage(0, data, id);
  } catch (e) {
    showError('Erro ao carregar: ' + e.message);
  }
}

function showError(msg) {
  loading.classList.add('hidden');
  stageBox.classList.add('hidden');
  errorBox.classList.remove('hidden');
  document.getElementById('errorMsg').textContent = msg;
}

function runStage(stageIndex, data, id) {
  stageLabel.textContent = `Etapa ${stageIndex + 1} de ${STAGES}`;
  let remaining = STAGE_SECONDS;
  countdownEl.textContent = remaining;
  progressBar.style.width = '0%';
  const total = STAGE_SECONDS;
  const timer = setInterval(() => {
    remaining--;
    countdownEl.textContent = remaining;
    progressBar.style.width = ((total - remaining) / total * 100) + '%';
    if (remaining <= 0) {
      clearInterval(timer);
      progressBar.style.width = '100%';
      if (stageIndex + 1 < STAGES) {
        setTimeout(() => runStage(stageIndex + 1, data, id), 400);
      } else {
        finish(data, id);
      }
    }
  }, 1000);
}

async function finish(data, id) {
  stageBox.classList.add('hidden');
  doneBox.classList.remove('hidden');
  try {
    await db.ref('links/' + id + '/clicks').transaction(c => (c || 0) + 1);
    if (data.ownerUid) {
      await db.ref('users/' + data.ownerUid + '/totalClicks').transaction(c => (c || 0) + 1);
    }
  } catch (e) { console.error(e); }
  let target = data.url;
  try {
    const u = new URL(target);
    if (!/^https?:$/.test(u.protocol)) throw new Error('invalid');
  } catch {
    showError('URL de destino inválida.');
    return;
  }
  setTimeout(() => { window.location.href = target; }, 800);
}

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function init() {
  particles = [];
  const count = Math.min(80, Math.floor(window.innerWidth / 18));
  for (let i=0;i<count;i++) particles.push({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    vx: (Math.random()-.5)*.35, vy: (Math.random()-.5)*.35,
    r: Math.random()*1.6+.5,
    c: ['#ef4444','#ffffff','#f87171'][Math.floor(Math.random()*3)],
  });
}
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x<0||p.x>canvas.width) p.vx*=-1;
    if (p.y<0||p.y>canvas.height) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=8; ctx.fill();
  }
  ctx.shadowBlur=0;
  requestAnimationFrame(draw);
}
resize(); init(); draw();
window.addEventListener('resize', ()=>{ resize(); init(); });
</script>
</body>
</html>
